<!-- 심사위원 안내 무대 슬라이드 — 시네마틱 갈라 톤(딥블루블랙+골드) · QR·접속주소·입력 4스텝 회전·BGM -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>심사 평가 안내</title>
<style>
  /* 로컬 번들 폰트(오프라인·사내망에서도 동일 렌더 — awards 덱과 동일) */
  @font-face{font-family:"Pretendard";font-weight:900;font-display:block;src:url("assets/fonts/Pretendard-Black.woff2") format("woff2");}
  @font-face{font-family:"Pretendard";font-weight:700;font-display:block;src:url("assets/fonts/Pretendard-Bold.woff2") format("woff2");}
  @font-face{font-family:"Pretendard";font-weight:400 500;font-display:block;src:url("assets/fonts/Pretendard-Medium.woff2") format("woff2");}
  @font-face{font-family:"Pretendard";font-weight:300;font-display:block;src:url("assets/fonts/Pretendard-Light.woff2") format("woff2");}
  :root{
    --void:#070A12; --void2:#0B1322;
    --gold:#E8C977; --gold-soft:#C9B27A; --gold-dim:#7E7048; --ink:#EDE7D2; --muted:#9aa6b8;
    --serif:"Pretendard","맑은 고딕","Malgun Gothic",sans-serif;
    --sans:"Pretendard","맑은 고딕","Malgun Gothic",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--void);color:var(--ink);
    font-family:var(--sans);word-break:keep-all;}
  /* ===== 배경 레이어(시네마틱 2색온도 조명 — awards와 동일 언어) ===== */
  #bg{position:fixed;inset:0;width:100%;height:100%;z-index:1;}
  #spot{position:fixed;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(125% 85% at 50% 6%, rgba(232,201,119,.22), rgba(160,120,40,.05) 40%, rgba(0,0,0,0) 64%);
    animation:spotPulse 6.5s ease-in-out infinite;}
  #rim{position:fixed;inset:0;z-index:2;pointer-events:none;mix-blend-mode:screen;
    background:radial-gradient(80% 70% at 6% 104%, rgba(58,110,165,.28), rgba(40,80,130,.06) 42%, rgba(0,0,0,0) 66%);}
  #vig{position:fixed;inset:0;z-index:3;pointer-events:none;
    background:radial-gradient(120% 120% at 50% 44%, rgba(0,0,0,0) 52%, rgba(0,0,0,.72) 100%);}
  @keyframes spotPulse{0%,100%{opacity:.8}50%{opacity:1}}
  /* ===== 골드 시머/디바이더(핵심 골드 텍스트에만) ===== */
  .shimmer-gold{background-image:linear-gradient(110deg,#B8862B 0%,#E8C977 16%,#FFFBE9 33%,#F2D88A 46%,#D4AF37 62%,#9A6F1E 100%);
    background-size:230% 100%;background-position:210% 0;-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:#E8C977;animation:shimmerSweep 3.6s linear infinite;}
  @keyframes shimmerSweep{0%{background-position:210% 0}100%{background-position:-30% 0}}
  .g-gold{background:linear-gradient(180deg,#FFF7DD 0%,#F3D88A 32%,#D4AF37 64%,#9A6F1E 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:#D4AF37;}
  .divline{height:2px;width:360px;margin:22px 0;transform-origin:left;
    background:linear-gradient(90deg,#D4AF37 0%,#FFF0C0 40%,#D4AF37 70%,transparent);}
  /* ===== 무대 16:9 캔버스(1920x1080 기준 스케일) ===== */
  #stage{position:fixed;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;}
  #canvas{width:1920px;height:1080px;transform-origin:center center;display:grid;
    grid-template-columns:780px 1fr;gap:72px;padding:96px 120px;align-content:center;}
  /* 접속 카드 */
  .left{display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(130% 150% at 50% 0%, #17130b, #0a0e17 72%);
    border:1px solid rgba(212,175,55,.24);border-radius:26px;padding:56px 48px;
    box-shadow:0 18px 60px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.02);}
  .left .label{font-size:22px;font-weight:600;color:var(--gold-soft);letter-spacing:.24em;text-transform:uppercase;
    margin-bottom:30px;display:flex;align-items:center;gap:10px;}
  .left .label b{font-weight:700;color:var(--gold);letter-spacing:.02em;text-transform:none;font-size:26px;}
  #qr{width:452px;height:452px;background:#fff;border-radius:18px;padding:24px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 3px rgba(212,175,55,.42), 0 0 46px rgba(212,175,55,.18);}
  #qr svg{width:100%;height:100%;}
  .url{margin-top:32px;font-size:30px;font-weight:700;word-break:break-all;text-align:center;color:#F0DDA4;letter-spacing:.01em;}
  .url small{display:block;font-size:19px;color:var(--muted);font-weight:500;margin-top:10px;letter-spacing:0;}
  /* 우측 안내 */
  .right{display:flex;flex-direction:column;justify-content:center;}
  .eyebrow{font-size:24px;font-weight:600;color:var(--gold-soft);letter-spacing:.42em;text-transform:uppercase;}
  .h1{font-family:var(--serif);font-size:78px;font-weight:900;letter-spacing:-.02em;line-height:1.08;margin:14px 0 4px;}
  .recusal{display:inline-flex;align-items:center;gap:12px;font-size:23px;font-weight:500;color:#e7dcc0;
    background:linear-gradient(180deg,rgba(212,175,55,.12),rgba(212,175,55,.03));
    border:1px solid rgba(212,175,55,.45);padding:15px 24px;border-radius:999px;margin-top:20px;width:fit-content;}
  .recusal .ck{color:var(--gold);font-weight:900;}
  .steps{margin-top:44px;display:flex;flex-direction:column;gap:16px;}
  .step{display:flex;align-items:center;gap:26px;padding:24px 30px;border-radius:18px;
    border:1px solid rgba(212,175,55,.14);background:rgba(255,255,255,.02);opacity:.4;
    transition:opacity .45s, transform .45s, border-color .45s, background .45s, box-shadow .45s;}
  .step.on{opacity:1;border-color:rgba(212,175,55,.5);transform:translateX(10px);
    background:linear-gradient(90deg,rgba(212,175,55,.12),rgba(212,175,55,.02));
    box-shadow:0 10px 34px rgba(212,175,55,.14);}
  .step .no{flex:0 0 auto;width:60px;height:60px;border-radius:15px;display:grid;place-items:center;
    font-family:var(--serif);font-size:29px;font-weight:900;background:#0d1018;color:var(--gold-dim);
    border:1.5px solid rgba(212,175,55,.2);transition:.45s;}
  .step.on .no{background:linear-gradient(160deg,#fbeeb4,#e6c659 42%,#9a7320);color:#2a1c06;border-color:transparent;
    box-shadow:0 0 20px rgba(212,175,55,.45);}
  .step .tx{font-size:33px;font-weight:700;color:var(--ink);}
  .step.on .tx{color:#fff;}
  .step .tx small{display:block;font-size:21px;color:var(--muted);font-weight:500;margin-top:5px;}
  /* ===== HUD ===== */
  #topline{position:fixed;z-index:7;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,transparent,#d4af37 22%,#fff0c0 50%,#d4af37 78%,transparent);opacity:.7;}
  #brand{position:fixed;z-index:7;top:18px;left:24px;color:#7e7048;font-size:13px;letter-spacing:.34em;font-weight:500;}
  #ctrls{position:fixed;z-index:7;top:15px;right:18px;display:flex;gap:8px;}
  #ctrls button{background:rgba(255,255,255,.05);border:1px solid rgba(212,175,55,.3);color:#cbbd86;border-radius:8px;
    width:38px;height:38px;cursor:pointer;font-size:15px;font-family:inherit;}
  #ctrls button:hover{background:rgba(212,175,55,.16);}
  #hint{position:fixed;z-index:7;bottom:18px;left:0;right:0;text-align:center;color:#6b6450;font-size:12.5px;letter-spacing:.1em;transition:opacity .5s;}
  /* ===== 시작 게이트 ===== */
  #start{position:fixed;inset:0;z-index:8;background:var(--void);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2.4vh;cursor:pointer;text-align:center;padding:0 6vw;}
  #start .gicon{font-size:clamp(40px,6vw,72px);}
  #start h2{font-family:var(--serif);font-weight:900;font-size:clamp(34px,5.6vw,72px);}
  #start p{color:var(--gold-soft);font-size:clamp(14px,1.8vw,22px);letter-spacing:.06em;}
  #blackout{position:fixed;inset:0;z-index:9;background:#000;display:none;} #blackout.on{display:block;}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="spot"></div>
<div id="rim"></div>
<div id="vig"></div>
<div id="topline"></div>
<div id="brand">SHINSHIN GROUP · 2026</div>
<div id="ctrls"><button id="mute" title="음소거">♪</button><button id="fs" title="전체화면">⛶</button></div>

<div id="stage"><div id="canvas">
  <div class="left">
    <div class="label"><span>📱</span><b>심사 평가 페이지 접속</b></div>
    <div id="qr"></div>
    <div class="url" id="url"></div>
  </div>
  <div class="right">
    <div class="eyebrow">지 금 부 터</div>
    <div class="divline"></div>
    <div class="h1"><span class="shimmer-gold">심사 평가</span> 시간입니다</div>
    <div class="recusal"><span class="ck">✓</span> 본인 소속 팀은 자동으로 평가 대상에서 제외됩니다</div>
    <div class="steps" id="steps"></div>
  </div>
</div></div>

<div id="hint">→ / Space 다음 · ← 이전 · F 전체화면 · B 블랙아웃 · M 음소거</div>
<div id="start"><div class="gicon">⚖️</div><h2 class="g-gold">심사 평가 안내</h2><p>화면을 클릭하거나 Space를 눌러 시작</p></div>
<div id="blackout"></div>
<audio id="bgm" loop></audio>

<script src="config.js"></script>
<script src="vendor/qrcode.js"></script>
<script>
// 운영 콘솔(admin.html)에서 저장한 judgeUrl이 있으면 우선 사용
try { var _j = localStorage.getItem("stage.judgeUrl"); if (_j) CONFIG.judgeUrl = _j; } catch (e) {}
// 입력 4스텝 정의(judge 흐름을 본뜬 미니어처 텍스트)
var STEPS = [
  { no: "1", t: "발표 법인 선택", s: "발표 순서대로 법인 단계 이동 (본인 소속 제외)" },
  { no: "2", t: "출품작 확인", s: "해당 법인의 BP · WP · AX 출품작 카드 확인" },
  { no: "3", t: "항목별 1~5점", s: "각 평가 항목을 1~5점 버튼으로 채점" },
  { no: "4", t: "제출", s: "제출 후에도 평가 시간 내 수정 가능" }
];
var stepsEl = document.getElementById("steps");
stepsEl.innerHTML = STEPS.map(function (s) {
  return "<div class='step'><div class='no'>" + s.no + "</div><div class='tx'>" + s.t + "<small>" + s.s + "</small></div></div>";
}).join("");
var stepNodes = stepsEl.querySelectorAll(".step");

// QR + URL
(function () {
  var qr = qrcode(0, "M");
  qr.addData(CONFIG.judgeUrl);
  qr.make();
  document.getElementById("qr").innerHTML = qr.createSvgTag(6, 0);
  var u = CONFIG.judgeUrl.replace(/^https?:\/\//, "");
  document.getElementById("url").innerHTML = u + "<small>휴대폰 카메라로 QR을 스캔하세요</small>";
})();

// 16:9 스케일 맞춤
function fit() {
  var c = document.getElementById("canvas");
  var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  c.style.transform = "scale(" + s + ")";
}
window.addEventListener("resize", fit); fit();

// 스텝 자동 회전
var cur = 0;
function showStep(i) {
  cur = (i + stepNodes.length) % stepNodes.length;
  stepNodes.forEach(function (n, k) { n.classList.toggle("on", k === cur); });
}
var timer = null;
function autorotate() { clearInterval(timer); timer = setInterval(function () { showStep(cur + 1); }, 3500); }

// 시작 게이트(BGM 자동재생 정책 대응) — 추출 BGM은 안내 덱 전용
var started = false, muted = false;
function start() {
  if (started) return; started = true;
  document.getElementById("start").style.display = "none";
  var bgm = document.getElementById("bgm");
  if (CONFIG.bgm && CONFIG.bgm.mode === "file") {
    bgm.src = CONFIG.bgm.file; bgm.volume = CONFIG.bgm.volume != null ? CONFIG.bgm.volume : 0.5;
    bgm.muted = muted; bgm.play().catch(function () {});
  }
  showStep(0); autorotate();
}
document.getElementById("start").addEventListener("click", start);

function toggleMute() {
  muted = !muted;
  var b = document.getElementById("mute"); b.textContent = muted ? "✕" : "♪"; b.style.color = muted ? "#7a6f50" : "#cbbd86";
  var bgm = document.getElementById("bgm"); if (bgm) bgm.muted = muted;
}
function toggleFs() { if (!document.fullscreenElement) { if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen(); } else if (document.exitFullscreen) document.exitFullscreen(); }

// 제어키
var blackout = document.getElementById("blackout");
document.addEventListener("keydown", function (e) {
  var k = e.key.toLowerCase();
  if (e.key === " " || e.key === "ArrowRight") { e.preventDefault(); if (!started) { start(); return; } showStep(cur + 1); autorotate(); }
  else if (e.key === "ArrowLeft") { showStep(cur - 1); autorotate(); }
  else if (k === "f") { toggleFs(); }
  else if (k === "b") { blackout.classList.toggle("on"); }
  else if (k === "m") { toggleMute(); }
});
document.getElementById("stage").addEventListener("click", function () { if (started) { showStep(cur + 1); autorotate(); } });
document.getElementById("fs").addEventListener("click", function (e) { e.stopPropagation(); toggleFs(); });
document.getElementById("mute").addEventListener("click", function (e) { e.stopPropagation(); toggleMute(); });

/* ===================== 골드 파티클 배경(awards 덱과 동일 언어) ===================== */
var bg = document.getElementById("bg"), bx = bg.getContext("2d"), pw, ph, parts = [];
function sizeBg() { pw = bg.width = innerWidth; ph = bg.height = innerHeight; }
function initParts() {
  parts = []; var n = Math.round(innerWidth / 15);
  for (var i = 0; i < n; i++) parts.push({ x: Math.random() * pw, y: Math.random() * ph, r: Math.random() * 2.4 + .5,
    s: Math.random() * .34 + .1, tw: Math.random() * Math.PI * 2, tws: Math.random() * .035 + .008, em: Math.random() < .07 });
}
function drawBg() {
  bx.clearRect(0, 0, pw, ph);
  for (var i = 0; i < parts.length; i++) {
    var p = parts[i]; p.y -= p.s; p.tw += p.tws; if (p.y < -6) { p.y = ph + 6; p.x = Math.random() * pw; }
    var a = .28 + Math.sin(p.tw) * .28; var rr = p.em ? p.r * 1.8 : p.r;
    if (p.em) { bx.shadowBlur = 12; bx.shadowColor = "rgba(255,214,120,.9)"; } else { bx.shadowBlur = 0; }
    bx.beginPath(); bx.arc(p.x, p.y, rr, 0, 7);
    bx.fillStyle = "rgba(255," + (208 + (Math.sin(p.tw) * 22 | 0)) + ",120," + a.toFixed(2) + ")"; bx.fill();
  }
  bx.shadowBlur = 0;
  requestAnimationFrame(drawBg);
}

// 힌트 자동 숨김
var hideT, hint = document.getElementById("hint");
function pokeHint() { hint.style.opacity = "1"; clearTimeout(hideT); hideT = setTimeout(function () { hint.style.opacity = "0"; }, 3000); }
addEventListener("mousemove", pokeHint);
addEventListener("resize", function () { sizeBg(); initParts(); });
sizeBg(); initParts(); drawBg(); pokeHint();

/* 스크린샷/리허설용 자동 진행: ?auto&step=N (운영 동작엔 영향 없음) */
(function maybeAuto() {
  var sp = new URLSearchParams(location.search);
  if (!sp.has("auto")) return;
  start();
  if (sp.has("step")) {
    var n = parseInt(sp.get("step") || "0", 10) || 0;
    clearInterval(timer);           // 결정적 캡처: 자동회전 정지
    showStep(Math.max(0, Math.min(n, stepNodes.length - 1)));
  }
})();
</script>
</body>
</html>
