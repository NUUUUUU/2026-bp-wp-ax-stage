<!DOCTYPE html>
<html lang="ko">
<!-- 시상 발표 무대 슬라이드 — 라이브 집계(JSONP)→스냅샷, WP→BP→AX 우수상→대상 극적 리빌 -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시상 발표</title>
<style>
  :root{ --rausch:#FF385C; --gold:#E0A100; --silver:#8A9099; --ink:#F4F4F5; --muted:#9aa0a6; --bg:#08080B; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Pretendard","맑은 고딕","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #canvas{position:relative;width:1920px;height:1080px;transform-origin:center;overflow:hidden;}
  .scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    opacity:0;transition:opacity .5s;text-align:center;padding:0 120px;}
  .scr.on{opacity:1;}
  /* 분야 카드 */
  .cat-eyebrow{font-size:34px;font-weight:700;color:var(--muted);letter-spacing:.08em;}
  .cat-k{font-size:200px;font-weight:900;letter-spacing:-.04em;color:var(--rausch);line-height:1;margin:8px 0;}
  .cat-name{font-size:52px;font-weight:700;}
  /* 서스펜스 */
  .su-cat{font-size:40px;color:var(--muted);font-weight:700;}
  .su-title{font-size:96px;font-weight:900;margin:14px 0 28px;}
  .su-dots{font-size:120px;letter-spacing:.1em;color:var(--rausch);animation:pulse 1.1s infinite;}
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
  /* 리빌 */
  .rv-medal{font-size:180px;line-height:1;filter:drop-shadow(0 10px 30px rgba(0,0,0,.5));animation:pop .6s cubic-bezier(.2,1.4,.4,1);}
  .rv-rank{font-size:40px;font-weight:800;letter-spacing:.04em;margin-top:6px;}
  .rv-team{font-size:140px;font-weight:900;letter-spacing:-.03em;margin:6px 0 8px;animation:slam .6s cubic-bezier(.15,1.5,.4,1);}
  .rv-score{font-size:40px;color:var(--muted);} .rv-score b{color:#fff;font-size:52px;}
  .rv-prize{margin-top:30px;font-size:42px;font-weight:800;color:#fff;background:var(--rausch);
    padding:18px 40px;border-radius:999px;display:inline-block;}
  .gold .rv-rank{color:var(--gold);} .gold .rv-prize{background:linear-gradient(135deg,#F0C24B,var(--gold));color:#1a1400;}
  .silver .rv-rank{color:var(--silver);}
  @keyframes pop{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
  @keyframes slam{0%{transform:scale(1.6);opacity:0;filter:blur(8px)}100%{transform:scale(1);opacity:1;filter:blur(0)}}
  #confetti{position:absolute;inset:0;pointer-events:none;}
  #status{position:fixed;top:18px;left:18px;font-size:15px;color:var(--muted);background:rgba(0,0,0,.5);
    padding:6px 12px;border-radius:8px;z-index:40;}
  .hint{position:fixed;bottom:20px;left:0;right:0;text-align:center;color:var(--muted);font-size:16px;opacity:.55;}
  #start{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:18px;cursor:pointer;z-index:50;}
  #start h2{font-size:56px;font-weight:900;} #start p{font-size:22px;color:var(--muted);}
  .blackout{position:fixed;inset:0;background:#000;z-index:60;display:none;} .blackout.on{display:block;}
</style>
</head>
<body>
<div id="start"><h2>🏆 시상식</h2><p>결과를 불러오는 중...</p></div>
<div id="status">—</div>
<div id="stage"><div id="canvas"><canvas id="confetti" width="1920" height="1080"></canvas></div></div>
<div class="hint">→ / Space 다음 · ← 이전 · R 결과 새로고침 · F 전체화면 · B 블랙아웃</div>
<div class="blackout" id="blackout"></div>
<audio id="bgm" loop></audio>

<script src="config.js"></script>
<script src="logic.js"></script>
<script>
// 데모 더미(?demo=1): API 없이 리허설용 — 팀 총점이 명확히 갈리는 합성 제출
var DEMO_SUBS = (function () {
  var subs = [];
  for (var i = 0; i < 3; i++) {
    var scores = { BP: {}, WP: {}, AX: {} };
    CONFIG.teams.forEach(function (t, idx) { ["BP", "WP", "AX"].forEach(function (c) { scores[c][t] = 92 - idx * 6 - (c === "AX" ? idx : 0); }); });
    subs.push({ name: "위원" + i, dept: "심사", scores: scores });
  }
  return subs;
})();

var canvas = document.getElementById("canvas");
var SCREENS = [], idx = 0, started = false;

function fit() {
  var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  canvas.style.transform = "scale(" + s + ")";
}
window.addEventListener("resize", fit); fit();

function setStatus(t) { document.getElementById("status").textContent = t; }

// 화면 1개 렌더 → DOM 요소 반환
function renderScreen(s) {
  var el = document.createElement("div");
  el.className = "scr" + (s.type === "reveal" ? (s.rank === 1 ? " gold" : s.rank === 2 ? " silver" : "") : "");
  if (s.type === "cat") {
    el.innerHTML = "<div class='cat-eyebrow'>시상 부문</div><div class='cat-k'>" + s.label + "</div><div class='cat-name'>" + s.name + "</div>";
  } else if (s.type === "suspense") {
    el.innerHTML = "<div class='su-cat'>" + s.label + " · " + s.title + "</div><div class='su-title'>과연 그 주인공은…</div><div class='su-dots'>● ● ●</div>";
  } else {
    el.innerHTML = "<div class='rv-medal'>" + s.medal + "</div><div class='rv-rank'>" + s.label + " · " + s.title + "</div>"
      + "<div class='rv-team'>" + s.team + "</div><div class='rv-score'>최종 <b>" + s.med.toFixed(1) + "</b> / 100</div>"
      + "<div class='rv-prize'>" + s.prize + "</div>";
  }
  return el;
}

function show(i) {
  if (!SCREENS.length) return;
  idx = Math.max(0, Math.min(SCREENS.length - 1, i));
  var old = canvas.querySelector(".scr.on");
  if (old) { old.classList.remove("on"); setTimeout(function () { if (old.parentNode) old.parentNode.removeChild(old); }, 500); }
  var s = SCREENS[idx];
  var el = renderScreen(s);
  canvas.appendChild(el);
  void el.offsetWidth; // reflow
  el.classList.add("on");
  if (s.type === "reveal" && s.isGrand) burstConfetti();
  setStatus((idx + 1) + " / " + SCREENS.length + " · " + s.cat + (s.type === "reveal" ? " " + s.title : ""));
}

// JSONP (admin과 동일 방식)
function jsonp(params) {
  return new Promise(function (res, rej) {
    var cb = "cb_" + Date.now() + Math.floor(Math.random() * 10000);
    var sc = document.createElement("script");
    var timer = setTimeout(function () { cleanup(); rej("시간 초과"); }, 15000);
    function cleanup() { clearTimeout(timer); delete window[cb]; if (sc.parentNode) sc.parentNode.removeChild(sc); }
    window[cb] = function (d) { cleanup(); res(d); };
    sc.onerror = function () { cleanup(); rej("네트워크 오류"); };
    sc.src = CONFIG.apiUrl + "?callback=" + cb + "&" + params;
    document.body.appendChild(sc);
  });
}

function buildFrom(subs) {
  var DATA = SCORING.buildDATA(CONFIG, subs);
  SCREENS = SCORING.buildScreens(CONFIG, DATA);
  idx = 0;
}

function loadResults() {
  var demo = new URLSearchParams(location.search).has("demo");
  if (demo) { buildFrom(DEMO_SUBS); document.getElementById("start").querySelector("p").textContent = "데모 데이터 · 클릭/Space로 시작"; setStatus("데모 모드 · " + SCREENS.length + "화면"); return Promise.resolve(); }
  return jsonp("action=get").then(function (d) {
    if (!d.ok) throw d.error || "오류";
    buildFrom(d.submissions || []);
    document.getElementById("start").querySelector("p").textContent = "준비 완료 · 클릭/Space로 시작";
    setStatus("결과 동기화 " + new Date().toLocaleTimeString("ko-KR") + " · " + SCREENS.length + "화면");
  }).catch(function (e) {
    document.getElementById("start").querySelector("p").textContent = "결과 로드 실패: " + e + " — R로 재시도";
    setStatus("로드 실패: " + e);
  });
}

// 손수 만든 컨페티
var cx = document.getElementById("confetti").getContext("2d");
var parts = [];
function burstConfetti() {
  for (var i = 0; i < 160; i++) parts.push({ x: 960, y: 380, vx: (Math.random() - .5) * 22, vy: Math.random() * -18 - 6,
    g: .5, c: ["#FF385C", "#E0A100", "#fff", "#FF7A93"][i % 4], s: 6 + Math.random() * 8, r: Math.random() * 6 });
}
(function loop() {
  cx.clearRect(0, 0, 1920, 1080);
  for (var i = parts.length - 1; i >= 0; i--) {
    var p = parts[i]; p.vy += p.g; p.x += p.vx; p.y += p.vy; p.r += .2;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s); cx.restore();
    if (p.y > 1140) parts.splice(i, 1);
  }
  requestAnimationFrame(loop);
})();

function start() {
  if (started || !SCREENS.length) return; started = true;
  document.getElementById("start").style.display = "none";
  var bgm = document.getElementById("bgm");
  if (CONFIG.bgm && CONFIG.bgm.mode === "file") { bgm.src = CONFIG.bgm.file; bgm.volume = CONFIG.bgm.volume != null ? CONFIG.bgm.volume : 0.5; bgm.play().catch(function () {}); }
  show(0);
}

var blackout = document.getElementById("blackout");
document.addEventListener("keydown", function (e) {
  var k = e.key.toLowerCase();
  if (e.key === " " || e.key === "ArrowRight") { e.preventDefault(); if (!started) { start(); return; } show(idx + 1); }
  else if (e.key === "ArrowLeft") { show(idx - 1); }
  else if (k === "r") { started = false; SCREENS = []; document.getElementById("start").style.display = "flex"; document.getElementById("start").querySelector("p").textContent = "결과 새로고침 중..."; loadResults(); }
  else if (k === "f") { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
  else if (k === "b") { blackout.classList.toggle("on"); }
});
document.getElementById("start").addEventListener("click", start);
document.getElementById("stage").addEventListener("click", function () { if (started) show(idx + 1); });

loadResults();
</script>
</body>
</html>
