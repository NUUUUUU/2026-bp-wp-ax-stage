<!DOCTYPE html>
<html lang="ko">
<!-- 시상 발표 무대 슬라이드 — 라이브 집계(JSONP)→스냅샷, WP→BP→AX 우수상→대상 시네마틱 갈라 리빌 -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시상 발표</title>
<style>
  /* 로컬 번들 폰트(오프라인·사내망에서도 동일 렌더) */
  @font-face{font-family:"Pretendard";font-weight:900;font-display:block;src:url("assets/fonts/Pretendard-Black.woff2") format("woff2");}
  @font-face{font-family:"Pretendard";font-weight:700;font-display:block;src:url("assets/fonts/Pretendard-Bold.woff2") format("woff2");}
  @font-face{font-family:"Pretendard";font-weight:400 500;font-display:block;src:url("assets/fonts/Pretendard-Medium.woff2") format("woff2");}
  @font-face{font-family:"Pretendard";font-weight:300;font-display:block;src:url("assets/fonts/Pretendard-Light.woff2") format("woff2");}
  :root{
    --void:#070A12; --void2:#0B1322;
    --gold:#E8C977; --gold-soft:#C9B27A; --gold-dim:#7E7048; --ink:#EDE7D2;
    --serif:"Pretendard","맑은 고딕","Malgun Gothic",sans-serif;
    --sans:"Pretendard","맑은 고딕","Malgun Gothic",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--void);color:var(--ink);font-family:var(--sans);word-break:keep-all;}
  /* ===== 배경 레이어(시네마틱 2색온도 조명) ===== */
  #bg,#confetti{position:fixed;inset:0;width:100%;height:100%;}
  #woven{position:fixed;inset:0;width:100%;height:100%;z-index:1;opacity:0;transition:opacity 1.4s ease;pointer-events:none;}
  #woven.on{opacity:1;}
  #bg{z-index:1;} #confetti{z-index:6;pointer-events:none;}
  #spot{position:fixed;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(125% 85% at 50% 8%, rgba(232,201,119,.24), rgba(160,120,40,.06) 40%, rgba(0,0,0,0) 64%);
    animation:spotPulse 6.5s ease-in-out infinite;}
  #rim{position:fixed;inset:0;z-index:2;pointer-events:none;mix-blend-mode:screen;
    background:radial-gradient(80% 70% at 6% 104%, rgba(58,110,165,.30), rgba(40,80,130,.06) 42%, rgba(0,0,0,0) 66%);}
  #vig{position:fixed;inset:0;z-index:3;pointer-events:none;
    background:radial-gradient(115% 115% at 50% 46%, rgba(0,0,0,0) 50%, rgba(0,0,0,.78) 100%);}
  #cvscrim{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity 1s ease;
    background:radial-gradient(60% 60% at 50% 52%, rgba(7,10,18,.76), rgba(7,10,18,.32) 55%, rgba(7,10,18,0) 78%);}
  #cvscrim.on{opacity:1;}
  #iris{position:fixed;inset:0;z-index:5;pointer-events:none;background:#000;opacity:0;}
  #iris.flash{animation:irisFlash 1.5s ease-out;}
  #dark{position:fixed;inset:0;z-index:5;pointer-events:none;opacity:0;transition:opacity .9s ease;
    background:linear-gradient(180deg,rgba(7,10,18,.12) 0%,rgba(7,10,18,.62) 26%,rgba(7,10,18,.96) 56%);}
  #dark.on{opacity:1;}
  @keyframes spotPulse{0%,100%{opacity:.78}50%{opacity:1}}
  @keyframes irisFlash{0%{opacity:.55}30%{opacity:0}100%{opacity:0}}
  /* ===== 무대 ===== */
  #stage{position:fixed;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;text-align:center;padding:6vh 6vw;}
  #stage.bannerlift{z-index:8;}  /* 포토타임: 현수막을 #dark(z5) 위로 — 어두워지는 버그 방지 */
  #content{max-width:1180px;width:100%;}
  #content.out{animation:sceneOut .34s ease both;}
  @keyframes sceneOut{to{opacity:0;transform:translateY(-16px)}}
  /* 배너에서 나갈 때: transform 없이 페이드만(=fixed 배너 하단 점프 방지) */
  #content.outb{animation:sceneOutFade .34s ease both;}
  @keyframes sceneOutFade{to{opacity:0}}
  /* 금속 텍스트 */
  .g-gold{background:linear-gradient(180deg,#FFF7DD 0%,#F3D88A 32%,#D4AF37 64%,#9A6F1E 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:#D4AF37;}
  .g-silver{background:linear-gradient(180deg,#FFFFFF 0%,#E4EAF2 34%,#BCC6D4 64%,#7C8696 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:#CBD5E3;}
  .g-bronze{background:linear-gradient(180deg,#FBE6C8 0%,#E7B782 34%,#C9853F 64%,#7E4E20 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:#D8A06A;}
  /* 골드 시머(shiny-text) — 핵심 골드 텍스트에만 */
  .shimmer-gold{background-image:linear-gradient(110deg,#B8862B 0%,#E8C977 16%,#FFFBE9 33%,#F2D88A 46%,#D4AF37 62%,#9A6F1E 100%);
    background-size:230% 100%;background-position:210% 0;-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:#E8C977;animation:shimmerSweep 3.6s linear infinite;}
  @keyframes shimmerSweep{0%{background-position:210% 0}100%{background-position:-30% 0}}
  /* 공통 타이포 */
  .eyebrow{font-size:clamp(13px,1.7vw,21px);letter-spacing:.52em;color:var(--gold-soft);font-weight:500;text-transform:uppercase;}
  .divline{height:2px;width:min(380px,52vw);margin:3vh auto;transform-origin:center;
    background:linear-gradient(90deg,transparent,#D4AF37 18%,#FFF0C0 50%,#D4AF37 82%,transparent);}
  .divline.grow{animation:grow .9s ease .15s both;}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .serif{font-family:var(--serif);}
  .a{opacity:0;animation:fadeUp .85s ease both;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
  /* 커버 */
  .cv-title{font-family:var(--serif);font-weight:900;font-size:clamp(38px,6.6vw,90px);line-height:1.1;letter-spacing:-.01em;}
  .cv-ceremony{font-family:var(--serif);font-weight:700;font-size:clamp(24px,3.6vw,46px);color:#F0DDA4;margin-top:.4em;letter-spacing:.06em;}
  .cv-en{font-size:clamp(12px,1.5vw,18px);letter-spacing:.5em;color:var(--gold-dim);text-transform:uppercase;margin-top:2.6vh;}
  .cv-trust{margin-top:3.2vh;font-size:clamp(12px,1.45vw,17px);color:#9aa6b8;letter-spacing:.06em;}
  .cv-trust b{color:var(--gold-soft);font-weight:500;}
  /* 섹션 */
  .sec-eyebrow{font-size:clamp(12px,1.5vw,18px);letter-spacing:.5em;color:var(--gold-dim);text-transform:uppercase;}
  .sec-name{font-family:var(--serif);font-weight:900;font-size:clamp(52px,10vw,140px);line-height:1.04;}
  .sec-full{font-size:clamp(13px,1.7vw,21px);letter-spacing:.42em;color:#9a8a5c;margin-top:1.6vh;text-transform:uppercase;}
  /* 티저 */
  .tz-main{font-weight:900;font-size:clamp(34px,5.4vw,76px);letter-spacing:-.01em;line-height:1.1;}
  .tz-q{font-weight:700;font-size:clamp(24px,3.4vw,46px);color:#E8E2CF;margin-top:1.6vh;}
  .tz-dots{font-weight:700;font-size:clamp(26px,4vw,52px);color:#cdbd84;margin-top:2.6vh;letter-spacing:.14em;
    animation:dots 1s steps(3) infinite;}
  @keyframes dots{0%{opacity:.35}50%{opacity:1}100%{opacity:.35}}
  /* 리빌 */
  .rv-grid{display:flex;align-items:center;justify-content:center;gap:5vw;text-align:left;}
  .rv-text{flex:0 1 660px;}
  .cat-label{font-size:clamp(16px,2.2vw,27px);letter-spacing:.16em;color:#cdb877;font-weight:500;display:inline-block;
    transform-origin:center;white-space:nowrap;}
  .rv-body{margin-top:2.2vh;}
  .rank-sub{font-size:clamp(11px,1.3vw,16px);letter-spacing:.42em;color:#8a7c52;text-transform:uppercase;}
  .name{font-family:var(--sans);font-weight:900;font-size:clamp(54px,9.4vw,140px);line-height:1.03;letter-spacing:-.01em;margin-top:.3vh;}
  /* 이름: 인너 span이 그라데이션+글로우(상시), 아우터 .name.rb가 등장(슬램) — 깜빡임 없음 */
  .name-gold,.name-silver{display:inline-block;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .name-gold{background-image:linear-gradient(110deg,#B8862B 0%,#E8C977 16%,#FFFBE9 33%,#F2D88A 46%,#D4AF37 62%,#9A6F1E 100%);
    background-size:230% 100%;color:#E8C977;animation:shimmerSweep 3.6s linear infinite, glowG 2.8s ease-in-out infinite;}
  .name-silver{background-image:linear-gradient(180deg,#FFFFFF 0%,#E4EAF2 34%,#BCC6D4 64%,#7C8696 100%);
    color:#CBD5E3;animation:glowS 2.8s ease-in-out infinite;}
  @keyframes glowG{0%,100%{filter:drop-shadow(0 0 18px rgba(212,175,55,.32))}50%{filter:drop-shadow(0 0 46px rgba(255,214,120,.85))}}
  @keyframes glowS{0%,100%{filter:drop-shadow(0 0 16px rgba(180,195,215,.3))}50%{filter:drop-shadow(0 0 42px rgba(225,235,245,.72))}}
  .name.rb{transform:scale(1.14);transition:opacity .55s ease, transform .75s cubic-bezier(.15,1.5,.4,1);}
  .name.rb.show{transform:scale(1);}
  /* median 공식점수 — 시그니처 */
  .score{margin-top:2.6vh;display:inline-block;}
  .score-num{font-family:var(--serif);font-weight:900;font-size:clamp(40px,6vw,82px);line-height:1;}
  .score-unit{font-size:clamp(18px,2.2vw,30px);color:#cfc9b6;margin-left:.12em;font-weight:500;}
  .score-line{height:2px;margin-top:1.1vh;background:linear-gradient(90deg,#D4AF37,#FFF0C0,transparent);transform-origin:left;
    animation:grow .8s ease .3s both;}
  .score-label{font-size:clamp(11px,1.3vw,15px);letter-spacing:.16em;color:#8a7c52;margin-top:1vh;}
  .score-label b{color:var(--gold-soft);font-weight:500;}
  .prize{display:block;width:fit-content;margin-top:2.2vh;padding:.45em 1.15em;border:1.5px solid rgba(212,175,55,.55);border-radius:12px;
    color:#f4e3a8;font-weight:700;font-size:clamp(16px,1.9vw,27px);letter-spacing:.01em;
    background:linear-gradient(180deg,rgba(212,175,55,.14),rgba(212,175,55,.04));box-shadow:0 6px 20px rgba(212,175,55,.14);}
  .stars{margin-top:2vh;color:#d4af37;font-size:clamp(15px,1.9vw,24px);letter-spacing:.5em;}
  .rb{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s ease;}
  .rb.show{opacity:1;transform:none;}
  /* 골드 링(이니셜) */
  .rv-photo{flex:0 0 auto;}
  .ring{position:relative;width:min(38vh,420px);height:min(38vh,420px);border-radius:50%;padding:9px;
    background:linear-gradient(160deg,#fff3c4,#d4af37 46%,#9a6f1e);animation:ringPulse 2.9s ease-in-out infinite;}
  .ring.s{background:linear-gradient(160deg,#ffffff,#bcc6d4 46%,#7c8696);}
  .ring.b{background:linear-gradient(160deg,#fbe6c8,#e7b782 46%,#7e4e20);}
  .ring::before{content:"";position:absolute;inset:-18px;border-radius:50%;z-index:-1;filter:blur(12px);
    background:conic-gradient(from 0deg,rgba(255,232,150,0),rgba(255,226,142,.95),rgba(212,175,55,.05),rgba(255,226,142,.88),rgba(255,232,150,0));
    animation:spin 5.5s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes ringPulse{0%,100%{box-shadow:0 0 42px rgba(212,175,55,.42)}50%{box-shadow:0 0 92px rgba(255,214,120,.82)}}
  .ring .face{position:relative;width:100%;height:100%;border-radius:50%;background:#0d1018;overflow:hidden;
    display:flex;align-items:center;justify-content:center;z-index:0;box-shadow:inset 0 0 30px rgba(0,0,0,.55);}
  .ring .flag{width:100%;height:100%;object-fit:cover;border-radius:50%;}
  .ring .face::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
    box-shadow:inset 0 0 0 4px rgba(0,0,0,.28), inset 0 16px 44px rgba(0,0,0,.42);
    background:radial-gradient(120% 80% at 50% 0%, rgba(255,255,255,.16), rgba(255,255,255,0) 44%);}
  .ring .init{font-family:var(--serif);font-weight:900;font-size:clamp(64px,11vw,128px);}
  .rank-badge{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);z-index:3;
    min-width:52px;height:52px;padding:0 14px;border-radius:999px;display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:25px;color:#2a1c06;background:linear-gradient(160deg,#fbeeb4,#e6c659 42%,#9a7320);
    box-shadow:0 6px 18px rgba(0,0,0,.45), inset 0 0 0 3px rgba(0,0,0,.18);}
  .rank-badge.s{background:linear-gradient(160deg,#ffffff,#cdd6e2 42%,#7c8696);color:#1a2230;}
  /* 포토타임 현수막 */
  #content.banner .rv-grid{flex-direction:column;align-items:center;}
  #content.banner .rv-text,#content.banner .rv-photo{display:none;}
  .banner-bar{display:none;}
  #content.banner .banner-bar{display:block;position:fixed;top:9.5vh;left:50%;width:min(1560px,92vw);z-index:7;
    padding:3px;border-radius:24px;background:linear-gradient(180deg,#fff0bf,#e6c45a 42%,#9a7320);
    box-shadow:0 0 80px rgba(212,175,55,.45);animation:bannerDrop .9s cubic-bezier(.2,.7,.2,1) both;}
  @keyframes bannerDrop{from{opacity:0;transform:translate(-50%,-70px)}to{opacity:1;transform:translate(-50%,0)}}
  .banner-inner{display:flex;align-items:center;justify-content:space-between;gap:2.4vw;width:100%;
    padding:2vh 2.4vw;border-radius:21px;background:radial-gradient(130% 200% at 50% 0%, #2b2114, #0c0f17 74%);}
  .seal{flex:0 0 auto;width:clamp(64px,10vh,116px);height:clamp(64px,10vh,116px);border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:900;color:#2a1c06;
    font-size:clamp(28px,5vh,56px);background:linear-gradient(160deg,#fbeeb4,#e6c659 42%,#9a7320);
    box-shadow:0 0 26px rgba(212,175,55,.5), inset 0 0 0 4px rgba(0,0,0,.22);}
  .banner-center{flex:1 1 auto;text-align:center;padding:0 1.4vw;min-width:0;}
  .b-top{font-size:clamp(13px,1.6vw,20px);color:#cdb877;letter-spacing:.1em;}
  .b-main{font-family:var(--serif);font-size:clamp(26px,4vw,56px);font-weight:900;line-height:1.14;margin:.5vh 0;}
  .b-sub{font-size:clamp(11px,1.3vw,15px);color:#8a7c52;letter-spacing:.2em;}
  /* 피날레 */
  .fn-title{font-weight:900;font-size:clamp(30px,4.6vw,64px);letter-spacing:-.01em;}
  .fn-board{display:flex;justify-content:center;gap:2.4vw;margin-top:2.6vh;flex-wrap:wrap;}
  .fn-col{flex:0 1 400px;background:rgba(255,255,255,.02);border:1px solid rgba(212,175,55,.18);border-radius:18px;
    padding:2.4vh 1.9vw;box-shadow:0 10px 40px rgba(0,0,0,.35);}
  .fn-cat{display:flex;align-items:baseline;gap:.6em;justify-content:center;margin-bottom:1.6vh;padding-bottom:1.3vh;
    border-bottom:1px solid rgba(212,175,55,.16);}
  .fn-k{font-weight:900;font-size:clamp(22px,2.7vw,36px);}
  .fn-kf{font-size:clamp(10px,1.05vw,13px);letter-spacing:.2em;color:#8a7c52;text-transform:uppercase;}
  .fn-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.8em;padding:1.2vh 0;
    border-bottom:1px solid rgba(255,255,255,.05);}
  .fn-row:last-child{border-bottom:none;}
  .fn-rank{font-size:clamp(11px,1.15vw,14px);font-weight:700;padding:.28em .75em;border-radius:999px;white-space:nowrap;}
  .fn-rank.g{color:#2a1c06;background:linear-gradient(160deg,#fbeeb4,#e6c659);}
  .fn-rank.s{color:#1a2230;background:linear-gradient(160deg,#fff,#cdd6e2);}
  .fn-team{font-weight:900;font-size:clamp(18px,2vw,27px);text-align:left;}
  .fn-score{font-weight:700;font-size:clamp(14px,1.5vw,19px);color:#cfc9b6;font-variant-numeric:tabular-nums;}
  .fn-score i{font-style:normal;font-size:.7em;color:#8a7c52;margin-left:1px;}
  .fn-prize{font-weight:700;font-size:clamp(13px,1.5vw,18px);color:#f4e3a8;white-space:nowrap;}
  .fn-congrats{font-family:var(--serif);font-weight:700;font-size:clamp(24px,3.4vw,46px);margin-top:3.2vh;letter-spacing:.02em;}
  /* HUD */
  #progress{position:fixed;z-index:7;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,#d4af37,#fff0c0);transition:width .4s;}
  #brand{position:fixed;z-index:7;top:18px;left:24px;color:#7e7048;font-size:13px;letter-spacing:.34em;font-weight:500;}
  #ctrls{position:fixed;z-index:7;top:15px;right:18px;display:flex;gap:8px;}
  #ctrls button{background:rgba(255,255,255,.05);border:1px solid rgba(212,175,55,.3);color:#cbbd86;border-radius:8px;
    width:38px;height:38px;cursor:pointer;font-size:15px;font-family:inherit;}
  #ctrls button:hover{background:rgba(212,175,55,.16);}
  #hint{position:fixed;z-index:7;bottom:18px;left:0;right:0;text-align:center;color:#6b6450;font-size:12.5px;letter-spacing:.1em;transition:opacity .5s;}
  /* 시작/로딩 게이트 */
  #start{position:fixed;inset:0;z-index:8;background:var(--void);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2.4vh;cursor:pointer;text-align:center;padding:0 6vw;}
  #start .gicon{font-size:clamp(40px,6vw,72px);}
  #start h2{font-family:var(--serif);font-weight:900;font-size:clamp(34px,5.6vw,72px);}
  #start p{color:var(--gold-soft);font-size:clamp(14px,1.8vw,22px);letter-spacing:.06em;}
  #blackout{position:fixed;inset:0;z-index:9;background:#000;display:none;} #blackout.on{display:block;}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="woven"></canvas>
<div id="spot"></div>
<div id="rim"></div>
<div id="vig"></div>
<div id="cvscrim"></div>
<div id="dark"></div>
<div id="iris"></div>
<canvas id="confetti"></canvas>
<div id="progress"></div>
<div id="brand">SHINSHIN AWARDS 2026</div>
<div id="ctrls"><button id="mute" title="음소거">♪</button><button id="fs" title="전체화면">⛶</button></div>
<div id="stage"><div id="content"></div></div>
<div id="hint">Space · 클릭 다음(공개 → 포토타임 → 다음) &nbsp;|&nbsp; ← 이전 &nbsp;|&nbsp; R 새로고침 &nbsp;|&nbsp; F 전체화면 &nbsp;|&nbsp; B 블랙아웃 &nbsp;|&nbsp; M 음소거</div>
<div id="start"><div class="gicon">🏆</div><h2 class="g-gold">2026 시상식</h2><p id="startMsg">결과를 불러오는 중…</p></div>
<div id="blackout"></div>

<script src="config.js"></script>
<script src="logic.js"></script>
<script src="vendor/three.min.js"></script>
<script>
// 운영 콘솔(admin.html)에서 저장한 apiUrl이 있으면 우선 사용
try { var _a = localStorage.getItem("stage.apiUrl"); if (_a) CONFIG.apiUrl = _a; } catch (e) {}
// 데모 더미(?demo=1): API 없이 리허설용 — 팀 총점이 명확히 갈리는 합성 제출
var DEMO_SUBS = (function () {
  var subs = [];
  for (var i = 0; i < 3; i++) {
    var scores = { BP: {}, WP: {}, AX: {} };
    CONFIG.teams.forEach(function (t, idx) { ["BP", "WP", "AX"].forEach(function (c) { scores[c][t] = 92 - idx * 6 - (c === "AX" ? idx : 0); }); });
    subs.push({ name: "위원" + i, dept: "심사", scores: scores });
  }
  return subs;
})();

// 부문별 영문 부제(발표 카피)
var CATMETA = { BP: "Best Practice", WP: "Worst Practice", AX: "Digital Transformation" };
var RANKSUB = { 1: "1st Place", 2: "2nd Place", 3: "3rd Place" };

var content = document.getElementById("content");

function esc(s) { return String(s == null ? "" : s).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); }
// 우리 시상은 대상=금, 나머지(우수상 2·3등)=은. 동(bronze) 없음.
function tierCls(rank) { return rank === 1 ? "g" : "s"; }
function tierGlow(rank) { return rank === 1 ? "glow-g" : "glow-s"; }
function tierGrad(rank) { return rank === 1 ? "g-gold" : "g-silver"; }

// JSONP (admin과 동일 방식)
function jsonp(params) {
  return new Promise(function (res, rej) {
    var cb = "cb_" + Date.now() + Math.floor(Math.random() * 10000);
    var sc = document.createElement("script");
    var timer = setTimeout(function () { cleanup(); rej("시간 초과"); }, 15000);
    function cleanup() { clearTimeout(timer); delete window[cb]; if (sc.parentNode) sc.parentNode.removeChild(sc); }
    window[cb] = function (d) { cleanup(); res(d); };
    sc.onerror = function () { cleanup(); rej("네트워크 오류"); };
    sc.src = CONFIG.apiUrl + "?callback=" + cb + "&" + params;
    document.body.appendChild(sc);
  });
}

// buildScreens(검증된 순서·집계) → 장면 시퀀스(커버/섹션/티저/리빌/피날레)
function buildScenes() {
  SCENES = [{ type: "cover" }];
  SCREENS.forEach(function (s) {
    if (s.type === "cat") SCENES.push({ type: "section", cat: s.label, name: s.name });
    else if (s.type === "suspense") SCENES.push({ type: "teaser", cat: s.label, name: s.name, title: s.title });
    else SCENES.push({ type: "reveal", cat: s.label, name: s.name, title: s.title, team: s.team, prize: s.prize, med: s.med, rank: s.rank, isGrand: s.isGrand, medal: s.medal });
  });
  SCENES.push({ type: "finale" });
  WINNERS = SCREENS.filter(function (s) { return s.type === "reveal"; });
  idx = 0; revealPhase = 0;
}
// 라이브/데모: 원시 제출 → 중앙값 집계 → 화면
function buildFrom(subs) {
  SCREENS = SCORING.buildScreens(CONFIG, SCORING.buildDATA(CONFIG, subs));
  buildScenes();
}
function medalFor(rank) { return rank === 1 ? "🥇" : rank === 2 ? "🥈" : "🏅"; }
// 확정본(운영 콘솔 admin.html에서 CEO 지시 반영·확정): 집계 대신 확정 명단 그대로 송출
function buildConfirmed(p) {
  var stepByKey = {}; CONFIG.steps.forEach(function (s) { stepByKey[s.key] = s; });
  SCREENS = [];
  (p.order && p.order.length ? p.order : SCORING.revealCats(CONFIG)).forEach(function (cat) {
    var st = stepByKey[cat] || { label: cat, sub: cat };
    SCREENS.push({ type: "cat", cat: cat, label: st.label, name: st.sub || st.label });
    var ws = ((p.winners && p.winners[cat]) || []).slice().sort(function (a, b) { return b.rank - a.rank; });
    ws.forEach(function (w) {
      var base = { cat: cat, label: st.label, name: st.sub || st.label, rank: w.rank, title: w.ttl || w.title, prize: w.prize, medal: medalFor(w.rank), team: w.team, med: (w.med == null ? 0 : w.med), isGrand: w.rank === 1 };
      SCREENS.push(Object.assign({ type: "suspense" }, base));
      SCREENS.push(Object.assign({ type: "reveal" }, base));
    });
  });
  buildScenes();
}
// 운영 콘솔이 저장한 확정 명단
function readConfirmed() {
  try { var r = localStorage.getItem("stage.confirmedWinners"); if (!r) return null; var p = JSON.parse(r); return (p && p.winners) ? p : null; } catch (e) { return null; }
}

function startMsg(t) { document.getElementById("startMsg").textContent = t; }

// apiUrl이 실제 배포 주소로 설정됐는지(placeholder면 미설정으로 간주)
function apiConfigured() {
  var u = (CONFIG.apiUrl || "");
  return /^https?:\/\//.test(u) && u.indexOf("PASTE_YOUR") === -1;
}
function loadResults() {
  var demo = new URLSearchParams(location.search).has("demo");
  // 우선순위: ?demo > 확정본 > 라이브 > 데모 폴백(오류 화면 방지)
  if (demo) { buildFrom(DEMO_SUBS); startMsg("데모 데이터 준비 완료 · 클릭 또는 Space로 시작"); maybeAuto(); return Promise.resolve(); }
  var conf = readConfirmed();
  if (conf) { buildConfirmed(conf); startMsg("확정 수상자 로드됨 · 클릭 또는 Space로 시작"); maybeAuto(); return Promise.resolve(); }
  if (!apiConfigured()) { buildFrom(DEMO_SUBS); startMsg("라이브 집계 미설정 · 데모 표시 · 클릭 또는 Space로 시작"); maybeAuto(); return Promise.resolve(); }
  return jsonp("action=get").then(function (d) {
    if (!d.ok) throw d.error || "오류";
    buildFrom(d.submissions || []);
    startMsg("결과 동기화 완료 · 클릭 또는 Space로 시작");
    maybeAuto();

    startMsg("결과 로드 실패: " + e + " — R로 재시도(또는 ?demo=1 데모)");

/* ===================== 렌더 + 리빌 연출 ===================== */
function render() {
  var s = SCENES[idx];
  revealPhase = 0;
  content.classList.remove("out", "outb", "banner");
  document.getElementById("dark").classList.remove("on");
  document.getElementById("stage").classList.remove("bannerlift");
  content.innerHTML = sceneHTML(s);
  document.getElementById("progress").style.width = (idx / (SCENES.length - 1) * 100) + "%";
  if (s.type === "cover") woven.show(); else woven.hide();
  document.getElementById("cvscrim").classList.toggle("on", s.type === "cover");
  if (s.type === "teaser") drumroll();
  if (s.type === "reveal") revealCinematic(s);
}

function revealCinematic(s) {
  var cols = s.rank === 1 ? ["#ffd86b", "#fff3c4"] : ["#cdd6e2", "#ffffff"];
  // 카테고리 라벨: 중앙·확대 → 제자리(FLIP)
  var lab = content.querySelector(".cat-label");
  if (lab) {
    var r = lab.getBoundingClientRect();
    var sc = Math.max(1.7, Math.min((innerWidth * 0.46) / Math.max(r.width, 1), 3.2));
    var tx = (innerWidth / 2) - (r.left + r.width / 2), ty = (innerHeight / 2) - (r.top + r.height / 2);
    lab.style.transition = "none"; lab.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + sc + ")"; lab.style.color = "#f6e8b6";
    void lab.offsetWidth;
    requestAnimationFrame(function () { lab.style.transition = "transform 1.05s cubic-bezier(.2,.7,.2,1), color .9s ease"; lab.style.transform = "none"; lab.style.color = ""; });
  }
  // 1.25s 후: 본문 공개 + 아이리스 플래시 + 컨페티 + 차임 + 점수 카운트업
  var rbs = content.querySelectorAll(".rb");
  setTimeout(function () {
    document.getElementById("iris").classList.remove("flash"); void document.getElementById("iris").offsetWidth;
    document.getElementById("iris").classList.add("flash");
    rbs.forEach(function (el, i) { el.style.transitionDelay = (i * 0.1) + "s"; el.classList.add("show"); });
    burst(cols); chime(s.rank);
    var num = content.querySelector(".score-num");
    if (num) countUp(num, parseFloat(num.getAttribute("data-to")), 1300);
  }, 1250);
  setTimeout(function () { burst(cols); }, 1750);
}

function countUp(el, to, dur) {
  var start = null;
  function step(ts) {
    if (start == null) start = ts;
    var p = Math.min((ts - start) / dur, 1);
    var e = 1 - Math.pow(1 - p, 3);
    el.textContent = (to * e).toFixed(1);
    if (p < 1) requestAnimationFrame(step); else el.textContent = to.toFixed(1);
  }
  requestAnimationFrame(step);
}

/* ===================== 이동 + 포토타임 ===================== */
function go(n) {
  var next = Math.min(Math.max(n, 0), SCENES.length - 1);
  if (next === idx) return;
  // 배너 상태에서 나갈 땐 transform 없는 페이드(outb)로 — fixed 배너가 하단으로 튀는 현상 방지
  content.classList.add(content.classList.contains("banner") ? "outb" : "out");
  setTimeout(function () { idx = next; render(); }, 330);
}
function enterBanner() { revealPhase = 1; content.classList.add("banner"); document.getElementById("dark").classList.add("on"); document.getElementById("stage").classList.add("bannerlift"); }
function exitBanner() { revealPhase = 0; content.classList.remove("banner"); document.getElementById("dark").classList.remove("on"); document.getElementById("stage").classList.remove("bannerlift"); }
function next() { if (SCENES[idx] && SCENES[idx].type === "reveal" && revealPhase === 0) { enterBanner(); return; } go(idx + 1); }
function prev() { if (revealPhase === 1) { exitBanner(); return; } go(idx - 1); }

/* ===================== woven light(three.js 골드 토러스노트) — 커버·피날레 배경 ===================== */
var woven = (function () {
  var cv = document.getElementById("woven");
  var inited = false, visible = false, renderer, scene, camera, points, clock;
  function init() {
    if (inited || typeof THREE === "undefined") return; inited = true;
    renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true });
    renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 100); camera.position.z = 5.2;
    var N = 16000, src = new THREE.TorusKnotGeometry(1.6, 0.52, 240, 36), sp = src.attributes.position, cnt = sp.count;
    var pos = new Float32Array(N * 3), col = new Float32Array(N * 3), c = new THREE.Color();
    for (var i = 0; i < N; i++) {
      var v = i % cnt;
      pos[i * 3] = sp.getX(v); pos[i * 3 + 1] = sp.getY(v); pos[i * 3 + 2] = sp.getZ(v);
      c.setHSL(0.107 + (Math.sin(i) * 0.5 + 0.5) * 0.03, 0.62, 0.4 + (Math.cos(i * 1.3) * 0.5 + 0.5) * 0.36);
      col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
    }
    var g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    g.setAttribute("color", new THREE.BufferAttribute(col, 3));
    var m = new THREE.PointsMaterial({ size: 0.022, vertexColors: true, blending: THREE.AdditiveBlending, transparent: true, opacity: 0.92, depthWrite: false });
    points = new THREE.Points(g, m); scene.add(points);
    clock = new THREE.Clock();
    addEventListener("resize", function () { if (!renderer) return; camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
    (function loop() { requestAnimationFrame(loop); if (!visible) return;
      var t = clock.getElapsedTime();
      points.rotation.y = t * 0.06; points.rotation.x = Math.sin(t * 0.13) * 0.18;
      var s = 1 + Math.sin(t * 0.6) * 0.03; points.scale.set(s, s, s);
      renderer.render(scene, camera);
    })();
  }
  return {
    show: function () { try { init(); } catch (e) {} visible = true; cv.classList.add("on"); },
    hide: function () { visible = false; cv.classList.remove("on"); }
  };
})();

/* ===================== 골드 파티클 배경 ===================== */
var bg = document.getElementById("bg"), bx = bg.getContext("2d"), pw, ph, parts = [];
function sizeBg() { pw = bg.width = innerWidth; ph = bg.height = innerHeight; }
function initParts() {
  parts = []; var n = Math.round(innerWidth / 13);
  for (var i = 0; i < n; i++) parts.push({ x: Math.random() * pw, y: Math.random() * ph, r: Math.random() * 2.6 + .5,
    s: Math.random() * .42 + .12, tw: Math.random() * Math.PI * 2, tws: Math.random() * .04 + .01, em: Math.random() < .08 });
}
function drawBg() {
  bx.clearRect(0, 0, pw, ph);
  for (var i = 0; i < parts.length; i++) {
    var p = parts[i]; p.y -= p.s; p.tw += p.tws; if (p.y < -6) { p.y = ph + 6; p.x = Math.random() * pw; }
    var a = .32 + Math.sin(p.tw) * .32; var rr = p.em ? p.r * 1.8 : p.r;
    if (p.em) { bx.shadowBlur = 12; bx.shadowColor = "rgba(255,214,120,.9)"; } else { bx.shadowBlur = 0; }
    bx.beginPath(); bx.arc(p.x, p.y, rr, 0, 7);
    bx.fillStyle = "rgba(255," + (208 + (Math.sin(p.tw) * 22 | 0)) + ",120," + a.toFixed(2) + ")"; bx.fill();
  }
  bx.shadowBlur = 0;
  requestAnimationFrame(drawBg);
}

/* ===================== 컨페티(양방향) ===================== */
var cf = document.getElementById("confetti"), cx = cf.getContext("2d"), cw, ch, pieces = [];
function sizeCf() { cw = cf.width = innerWidth; ch = cf.height = innerHeight; }
function burst(colors) {
  var N = 150;
  for (var i = 0; i < N; i++) {
    var fromLeft = i < N / 2;
    pieces.push({ x: fromLeft ? 0 : cw, y: ch * 0.6 * Math.random() + ch * 0.14,
      vx: (fromLeft ? 1 : -1) * (Math.random() * 9 + 5), vy: -(Math.random() * 11 + 6),
      g: 0.28 + Math.random() * 0.12, size: Math.random() * 8 + 4, rot: Math.random() * 6, vr: (Math.random() - .5) * .4,
      c: colors[Math.random() < .5 ? 0 : 1], life: 0, max: 120 + Math.random() * 40, shape: Math.random() < .5 ? 0 : 1 });
  }
}
function drawCf() {
  cx.clearRect(0, 0, cw, ch);
  for (var i = pieces.length - 1; i >= 0; i--) {
    var p = pieces[i]; p.life++; p.vy += p.g; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.rot += p.vr;
    var al = Math.max(0, 1 - p.life / p.max);
    cx.save(); cx.globalAlpha = al; cx.translate(p.x, p.y); cx.rotate(p.rot); cx.fillStyle = p.c;
    if (p.shape === 0) cx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.5);
    else { cx.beginPath(); cx.arc(0, 0, p.size / 2, 0, 7); cx.fill(); }
    cx.restore();
    if (p.life > p.max || p.y > ch + 20) pieces.splice(i, 1);
  }
  requestAnimationFrame(drawCf);
}

/* ===================== 사운드 (Web Audio, 파일 없음·오프라인) ===================== */
var muted = false, actx = null, master = null, noiseBuf = null;
// 마스터 버스: 컴프레서로 레이어링 시 클리핑 방지
function audio() {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    var comp = actx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 22; comp.ratio.value = 3.4; comp.attack.value = 0.004; comp.release.value = 0.22;
    master = actx.createGain(); master.gain.value = muted ? 0 : 0.9;
    master.connect(comp); comp.connect(actx.destination);
  }
  return actx;
}
function noise() {
  var ac = audio(); if (!ac) return null;
  if (!noiseBuf) { noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); var d = noiseBuf.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  return noiseBuf;
}
// 팀파니 타격: 피치 급강하 저음 + 짧은 감쇠
function timpani(t, freq, amp, dur) {

  var o = ac.createOscillator(), g = ac.createGain();
  o.type = "sine"; o.frequency.setValueAtTime(freq * 1.7, t); o.frequency.exponentialRampToValueAtTime(freq, t + 0.07);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(amp, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
}
// 심벌 크래시: 고역 화이트노이즈 + 긴 감쇠
function cymbal(t, amp, dur) {
  var ac = audio(); if (!ac) return; var nb = noise(); if (!nb) return;
  var s = ac.createBufferSource(); s.buffer = nb; s.loop = true;
  var hp = ac.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 5200;
  var g = ac.createGain(); s.connect(hp); hp.connect(g); g.connect(master);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(amp, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.start(t); s.stop(t + dur + 0.1);
}
// 팡파레: 밝은 브라스풍 코드(도-미-솔-도, 로우패스 sawtooth·살짝 디튠)
function fanfare(t, rootMidi, big) {
  var ac = audio(); if (!ac) return;
  var seq = big ? [[0, 0], [4, 0.12], [7, 0.24], [12, 0.42]] : [[0, 0], [4, 0.13], [7, 0.28]];
  seq.forEach(function (st) {
    var f = 440 * Math.pow(2, (rootMidi + st[0] - 69) / 12), tt = t + st[1];
    var o1 = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain(), lp = ac.createBiquadFilter();
    o1.type = "sawtooth"; o2.type = "sawtooth"; o1.frequency.value = f; o2.frequency.value = f * 1.006;
    lp.type = "lowpass"; lp.frequency.value = 3000;
    o1.connect(lp); o2.connect(lp); lp.connect(g); g.connect(master);
    var pk = big ? 0.11 : 0.09;
    g.gain.setValueAtTime(0.0001, tt); g.gain.linearRampToValueAtTime(pk, tt + 0.03); g.gain.setValueAtTime(pk, tt + 0.5); g.gain.exponentialRampToValueAtTime(0.0001, tt + 1.4);
    o1.start(tt); o2.start(tt); o1.stop(tt + 1.5); o2.stop(tt + 1.5);
  });
}
// 공개 순간(리빌) — 심벌 크래시 + 팡파레 + 팀파니 (대상은 더 웅장)
function chime(rank) {
  if (muted) return;
  try {
    var ac = audio(); if (!ac) return; var t = ac.currentTime + 0.01, big = rank === 1;
    cymbal(t, big ? 0.20 : 0.14, big ? 1.7 : 1.1);
    timpani(t, big ? 98 : 110, big ? 0.5 : 0.38, big ? 0.9 : 0.7);
    fanfare(t + 0.02, big ? 72 : 69, big);
    if (big) timpani(t + 0.52, 65, 0.42, 0.9);
  } catch (e) {}
}
// 티저 긴장감 — 가속 드럼롤 + 상승 라이저 + 팀파니 언더 + 마무리 붐
function drumroll() {
  if (muted) return;
  try {
    var ac = audio(); if (!ac) return; var nb = noise(); if (!nb) return;
    var t0 = ac.currentTime + 0.02, t = t0, n = 34;
    for (var k = 0; k < n; k++) {
      var s = ac.createBufferSource(); s.buffer = nb;
      var bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 200 + k * 4; bp.Q.value = 1.0;
      var g = ac.createGain(); s.connect(bp); bp.connect(g); g.connect(master);
      var amp = 0.05 + (k / n) * 0.16;
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(amp, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
      s.start(t, Math.random() * 0.5, 0.06); s.stop(t + 0.08);
      t += Math.max(0.028, 0.09 - (k / n) * 0.058);
    }
    var rollEnd = t;
    for (var m = 0; m < 4; m++) timpani(t0 + (rollEnd - t0) * (m / 4), 82, 0.13 + m * 0.05, 0.35);
    // 상승 라이저(긴장 고조)
    var o = ac.createOscillator(), rg = ac.createGain(), lp = ac.createBiquadFilter();
    o.type = "sawtooth"; lp.type = "lowpass"; lp.frequency.value = 1400;
    o.frequency.setValueAtTime(120, t0); o.frequency.exponentialRampToValueAtTime(520, rollEnd);
    rg.gain.setValueAtTime(0.0001, t0); rg.gain.exponentialRampToValueAtTime(0.09, rollEnd - 0.05); rg.gain.exponentialRampToValueAtTime(0.0001, rollEnd + 0.15);
    o.connect(lp); lp.connect(rg); rg.connect(master); o.start(t0); o.stop(rollEnd + 0.2);
    // 마무리 저음 붐
    timpani(rollEnd, 60, 0.5, 0.7);
  } catch (e) {}
}
function toggleMute() {
  muted = !muted;
  var b = document.getElementById("mute"); b.textContent = muted ? "✕" : "♪"; b.style.color = muted ? "#7a6f50" : "#cbbd86";
  if (master && actx) master.gain.setTargetAtTime(muted ? 0 : 0.9, actx.currentTime, 0.02); // 재생 중 소리도 즉시 반영
}

/* ===================== 시작/오디오 언락 ===================== */
function begin() {
  if (started || !SCENES.length) return; started = true;
  document.getElementById("start").style.display = "none";
  // 시상 덱은 BGM 음악 없음(추출 음원은 안내 덱 전용). 효과음(드럼롤·심벌·팡파레)만 Web Audio.
  try { audio(); } catch (e) {}
  idx = 0; render();
}

/* 스크린샷/리허설용 자동 점프: ?auto&scene=N&phase=banner (운영 동작엔 영향 없음) */
function maybeAuto() {
  var sp = new URLSearchParams(location.search);
  if (!sp.has("auto")) return;
  begin();
  var n = parseInt(sp.get("scene") || "0", 10) || 0;
  if (n > 0 && n < SCENES.length) { idx = n; render(); }
  if (sp.get("phase") === "banner" && SCENES[idx] && SCENES[idx].type === "reveal") { setTimeout(enterBanner, 1500); }
}

/* ===================== 컨트롤 ===================== */
function toggleFs() { if (!document.fullscreenElement) { if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen(); } else if (document.exitFullscreen) document.exitFullscreen(); }
function refresh() {
  started = false; SCENES = []; revealPhase = 0;
  document.getElementById("start").style.display = "flex"; startMsg("결과 새로고침 중…");
  loadResults();
}
document.addEventListener("keydown", function (e) {
  var k = e.key.toLowerCase();
  if (e.key === " " || e.key === "ArrowRight" || e.key === "Enter") { e.preventDefault(); if (!started) { begin(); return; } next(); }
  else if (e.key === "ArrowLeft") { if (started) prev(); }
  else if (k === "r") { refresh(); }
  else if (k === "f") { toggleFs(); }
  else if (k === "b") { document.getElementById("blackout").classList.toggle("on"); }
  else if (k === "m") { toggleMute(); }
});
document.getElementById("stage").addEventListener("click", function () { if (!started) { begin(); return; } next(); });
document.getElementById("start").addEventListener("click", begin);
document.getElementById("fs").addEventListener("click", function (e) { e.stopPropagation(); toggleFs(); });
document.getElementById("mute").addEventListener("click", function (e) { e.stopPropagation(); toggleMute(); });

// 힌트 자동 숨김
var hideT, hint = document.getElementById("hint");
function pokeHint() { hint.style.opacity = "1"; clearTimeout(hideT); hideT = setTimeout(function () { hint.style.opacity = "0"; }, 3000); }
addEventListener("mousemove", pokeHint);
addEventListener("resize", function () { sizeBg(); sizeCf(); initParts(); });

sizeBg(); sizeCf(); initParts(); drawBg(); drawCf(); pokeHint();
loadResults();
</script>
</body>
