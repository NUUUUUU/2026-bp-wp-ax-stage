<!-- 시상 효과음 튜닝 테스트(임시) — awards.html과 동일 오디오 엔진, 튜닝 후 삭제 가능 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시상 효과음 테스트</title>
<style>
  body{background:radial-gradient(120% 90% at 50% 0%,#141a2a,#070a12 75%);color:#EDE7D2;
    font-family:"Malgun Gothic","맑은 고딕",sans-serif;text-align:center;padding:46px 20px 80px;min-height:100vh;margin:0;}
  h1{color:#E8C977;font-size:30px;margin:0 0 8px;}
  .note{color:#9aa6b8;font-size:14px;line-height:1.7;max-width:560px;margin:0 auto 26px;}
  .sec{color:#c9b27a;font-size:13px;letter-spacing:.2em;text-transform:uppercase;margin:30px 0 12px;}
  button{font-family:inherit;font-weight:700;margin:6px;cursor:pointer;border-radius:12px;transition:.12s;}
  .big{font-size:18px;padding:18px 26px;color:#f4e3a8;border:1.5px solid rgba(212,175,55,.5);
    background:linear-gradient(180deg,rgba(212,175,55,.16),rgba(212,175,55,.04));box-shadow:0 6px 20px rgba(212,175,55,.12);}
  .big:hover{background:rgba(212,175,55,.26);transform:translateY(-2px);}
  .el button{font-size:14px;padding:11px 17px;color:#cbd5e3;border:1px solid rgba(160,180,210,.3);background:rgba(255,255,255,.04);}
  .el button:hover{background:rgba(255,255,255,.1);}
  label{display:block;margin:22px auto 0;max-width:440px;color:#c9b27a;font-size:14px;}
  input[type=range]{width:100%;margin-top:8px;accent-color:#E8C977;}
  .val{color:#E8C977;font-weight:800;}
</style>
</head>
<body>
<h1>🔊 시상 효과음 테스트</h1>
<div class="note">먼저 아무 버튼이나 한 번 눌러 <b>브라우저 오디오를 켜세요</b>. 스피커를 무대 수준 볼륨에 맞추고 들어본 뒤,
<b>실제 음원 파일</b>(assets/sfx/drumroll·reveal)이 있으면 그 소리로, 없으면 합성음으로 재생됩니다.
<b>파일을 들으려면 폴더에서 <code>npx serve .</code> 후</b> http://localhost:3000/_효과음테스트.html 로 여세요.</div>
<div id="fstat" style="color:#7fd6a3;font-size:14px;min-height:18px;margin:-8px 0 6px;"></div>

<label>마스터 볼륨 <span class="val" id="mv">0.90</span><input type="range" id="mvol" min="0" max="1.6" step="0.05" value="0.9"></label>

<div class="sec">전체 흐름</div>
<button class="big" onclick="drumroll()">🥁 티저 드럼롤</button>
<button class="big" onclick="chime(1)">🏆 공개 — 최우수상(금)</button>
<button class="big" onclick="chime(2)">🥈 공개 — 우수상(은)</button>
<div style="margin-top:10px"><button class="big" onclick="sequence()">▶ 티저 → 최우수상 공개 (실제 순서)</button></div>

<div class="sec">개별 요소</div>
<div class="el">
  <button onclick="rollOnly(audio().currentTime+0.02)">드럼롤(롤만)</button>
  <button onclick="riserOnly(audio().currentTime+0.02)">상승 라이저</button>
  <button onclick="timpani(audio().currentTime+0.02,60,0.5,0.7)">팀파니(저음 붐)</button>
  <button onclick="cymbal(audio().currentTime+0.02,0.2,1.6)">심벌 크래시</button>
  <button onclick="fanfare(audio().currentTime+0.02,72,true)">팡파레(최우수상)</button>
  <button onclick="fanfare(audio().currentTime+0.02,69,false)">팡파레(우수상)</button>
</div>

<script>
/* ===== awards.html과 동일한 오디오 엔진 ===== */
var actx = null, master = null, noiseBuf = null, MV = 0.9;
function audio() {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    var comp = actx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 22; comp.ratio.value = 3.4; comp.attack.value = 0.004; comp.release.value = 0.22;
    master = actx.createGain(); master.gain.value = MV;
    master.connect(comp); comp.connect(actx.destination);
    loadSfx();
  }
  return actx;
}
var sfxBuf = { drum: null, reveal: null }, sfxTried = false;
function loadSfx() {
  if (sfxTried || !actx) return; sfxTried = true;
  [["drum", "assets/sfx/drumroll"], ["reveal", "assets/sfx/reveal"]].forEach(function (p) {
    var exts = [".mp3", ".m4a", ".wav", ".ogg"], i = 0;
    (function tryNext() {
      if (i >= exts.length) { return; }
      fetch(p[1] + exts[i++]).then(function (r) { if (!r.ok) throw 0; return r.arrayBuffer(); })
        .then(function (ab) { return actx.decodeAudioData(ab); })
        .then(function (buf) { sfxBuf[p[0]] = buf; document.getElementById("fstat").textContent = "🎵 실제 음원 로드됨: " + (sfxBuf.drum ? "드럼롤 " : "") + (sfxBuf.reveal ? "팡파레" : ""); })
        .catch(function () { tryNext(); });
    })();
  });
}
function playBuf(buf, gain) {
  if (!actx || !buf || !master) return false;
  var s = actx.createBufferSource(); s.buffer = buf;
  var g = actx.createGain(); g.gain.value = (gain == null ? 1 : gain);
  s.connect(g); g.connect(master); s.start(actx.currentTime + 0.02); return true;
}
function noise() {
  var ac = audio(); if (!ac) return null;
  if (!noiseBuf) { noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); var d = noiseBuf.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  return noiseBuf;
}
function timpani(t, freq, amp, dur) {
  var ac = audio(); if (!ac) return;
  var o = ac.createOscillator(), g = ac.createGain();
  o.type = "sine"; o.frequency.setValueAtTime(freq * 1.7, t); o.frequency.exponentialRampToValueAtTime(freq, t + 0.07);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(amp, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
}
function cymbal(t, amp, dur) {
  var ac = audio(); if (!ac) return; var nb = noise(); if (!nb) return;
  var s = ac.createBufferSource(); s.buffer = nb; s.loop = true;
  var hp = ac.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 5200;
  var g = ac.createGain(); s.connect(hp); hp.connect(g); g.connect(master);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(amp, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.start(t); s.stop(t + dur + 0.1);
}
function fanfare(t, rootMidi, big) {
  var ac = audio(); if (!ac) return;
  var seq = big ? [[0, 0], [4, 0.12], [7, 0.24], [12, 0.42]] : [[0, 0], [4, 0.13], [7, 0.28]];
  seq.forEach(function (st) {
    var f = 440 * Math.pow(2, (rootMidi + st[0] - 69) / 12), tt = t + st[1];
    var o1 = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain(), lp = ac.createBiquadFilter();
    o1.type = "sawtooth"; o2.type = "sawtooth"; o1.frequency.value = f; o2.frequency.value = f * 1.006;
    lp.type = "lowpass"; lp.frequency.value = 3000;
    o1.connect(lp); o2.connect(lp); lp.connect(g); g.connect(master);
    var pk = big ? 0.11 : 0.09;
    g.gain.setValueAtTime(0.0001, tt); g.gain.linearRampToValueAtTime(pk, tt + 0.03); g.gain.setValueAtTime(pk, tt + 0.5); g.gain.exponentialRampToValueAtTime(0.0001, tt + 1.4);
    o1.start(tt); o2.start(tt); o1.stop(tt + 1.5); o2.stop(tt + 1.5);
  });
}
function chime(rank) {
  var ac = audio(); if (!ac) return; var t = ac.currentTime + 0.01, big = rank === 1;
  if (playBuf(sfxBuf.reveal, big ? 1 : 0.9)) return;   // 실제 음원 우선
  cymbal(t, big ? 0.20 : 0.14, big ? 1.7 : 1.1);
  timpani(t, big ? 98 : 110, big ? 0.5 : 0.38, big ? 0.9 : 0.7);
  fanfare(t + 0.02, big ? 72 : 69, big);
  if (big) timpani(t + 0.52, 65, 0.42, 0.9);
}
function rollOnly(t0) {
  var ac = audio(); if (!ac) return t0; var nb = noise(); if (!nb) return t0;
  var t = t0, n = 34;
  for (var k = 0; k < n; k++) {
    var s = ac.createBufferSource(); s.buffer = nb;
    var bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 200 + k * 4; bp.Q.value = 1.0;
    var g = ac.createGain(); s.connect(bp); bp.connect(g); g.connect(master);
    var amp = 0.05 + (k / n) * 0.16;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(amp, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    s.start(t, Math.random() * 0.5, 0.06); s.stop(t + 0.08);
    t += Math.max(0.028, 0.09 - (k / n) * 0.058);
  }
  return t;
}
function riserOnly(t0, rollEnd) {
  var ac = audio(); if (!ac) return; rollEnd = rollEnd || (t0 + 1.6);
  var o = ac.createOscillator(), rg = ac.createGain(), lp = ac.createBiquadFilter();
  o.type = "sawtooth"; lp.type = "lowpass"; lp.frequency.value = 1400;
  o.frequency.setValueAtTime(120, t0); o.frequency.exponentialRampToValueAtTime(520, rollEnd);
  rg.gain.setValueAtTime(0.0001, t0); rg.gain.exponentialRampToValueAtTime(0.09, rollEnd - 0.05); rg.gain.exponentialRampToValueAtTime(0.0001, rollEnd + 0.15);
  o.connect(lp); lp.connect(rg); rg.connect(master); o.start(t0); o.stop(rollEnd + 0.2);
}
function drumroll() {
  var ac = audio(); if (!ac) return;
  if (playBuf(sfxBuf.drum, 1)) return;   // 실제 음원 우선
  var t0 = ac.currentTime + 0.02;
  var rollEnd = rollOnly(t0);
  for (var m = 0; m < 4; m++) timpani(t0 + (rollEnd - t0) * (m / 4), 82, 0.13 + m * 0.05, 0.35);
  riserOnly(t0, rollEnd);
  timpani(rollEnd, 60, 0.5, 0.7);
}
function sequence() { drumroll(); setTimeout(function () { chime(1); }, 1900); }
document.getElementById("mvol").addEventListener("input", function (e) {
  MV = parseFloat(e.target.value); document.getElementById("mv").textContent = MV.toFixed(2);
  if (master && actx) master.gain.setTargetAtTime(MV, actx.currentTime, 0.02);
});
</script>
</body>
</html>
